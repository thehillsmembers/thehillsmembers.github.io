# ─────────────────────────────────────────────────────────────────────────────
#  SEVEN HILLS · SITE CONTENT
#  This is the only file you need to edit for text, dates and cities.
#
#  Simple rules:
#   - Keep the spaces at the start of each line exactly as they are.
#   - Text with a colon ( : ) or that starts with a quote must stay inside "quotes".
#   - Lines starting with # are notes. The site ignores them.
#   - Save the file. Locally the page updates when you refresh the browser.
#     Online, it updates a minute after you publish the change.
#
#  Links (href): a page of the site, like "/apply/" or "/#join",
#  or the word instagram for the Instagram page.
# ─────────────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════════════
#  1. AGENDA
#  One block per event. Past dates disappear by themselves.
#  While the list is empty, the Agenda section and its menu link are hidden.
#  They appear by themselves once a date is added here and published.
#
#  date:     year-month-day, in quotes. Shown as 07.03, with the weekday.
#  format:   one of the five experience names
#  city:     as you want it written (Lisboa, London…)
#  edition:  optional. Shown as Nº 12.
#  time:     optional. Shown as 20H30.
#  note:     optional. One short line, like the printed invite.
#
#  Example (remove the # at the start of each line to use it):
#
#  - date: "2027-03-11"
#    format: Table of Seven
#    city: Lisboa
#    edition: 1
#    time: "20:30"
#    note: "Fourteen seats, one question."
# ═════════════════════════════════════════════════════════════════════════════
agenda: []


# ═════════════════════════════════════════════════════════════════════════════
#  2. CITIES
#  In order. Each city gets a photo, named after it (lisboa.jpg…). The line about
#  the cities to come is further down, in the text: cities > accent.
# ═════════════════════════════════════════════════════════════════════════════
cities:
  - Lisboa


# ═════════════════════════════════════════════════════════════════════════════
#  3. CONTACTS
# ═════════════════════════════════════════════════════════════════════════════
instagram_handle: "@thehillsmembers"
instagram_url: "https://instagram.com/thehillsmembers"

# The founder's own pages, linked in the Founder block (next to Partners).
# A link left empty is not shown.
founder_instagram: "https://www.instagram.com/andrercarvalho05/"
founder_linkedin: "https://www.linkedin.com/in/andreredondocarvalho"


# ═════════════════════════════════════════════════════════════════════════════
#  4. FORMS
#  The Formspree address of each form (or just its ID, the letters at the end).
#  Answers arrive by email at thehillsmembers@gmail.com and are listed at
#  formspree.io (sign in with it).
#  newsletter: the sign-up for The Seventh. While it is empty, the sign-up is not
#  shown on the site (only in npm run dev).
# ═════════════════════════════════════════════════════════════════════════════
forms:
  apply: "https://formspree.io/f/moedpvga"
  partners: "https://formspree.io/f/xkjrpgdo"
  newsletter: ""


# ═════════════════════════════════════════════════════════════════════════════
#  5. PHOTOS
#  One photo per place, in src/assets/photos, named as below: hero.jpg,
#  table-of-seven.jpg… (.jpg, .png or .webp). Each one is cropped to the shape
#  of its place, so keep the subject near the middle.
#  After each name: a short description of the photo, for people who can't see
#  it. The site won't publish while a photo or its description is missing.
# ═════════════════════════════════════════════════════════════════════════════
photos:
  hero: "A long table set on a rooftop terrace in Lisboa, the sky pink over the city's rooftops."
  table-of-seven: "Guests by a red-lit bar on a Seven Hills night, under the timber roof."
  seven-hills-run: "Runners gathered outside a café on a sunny cobbled street in Lisboa."
  court-sessions: "Seven Hills padel: a match among the trees, friends watching from under a white parasol."
  culture-nights: "A DJ in a red cap and an orange sweatshirt at the decks on a Seven Hills night."
  off-the-hills: "A narrow street in the City of London, the Gherkin rising between the towers."
  circle: "Two guests on a Seven Hills night, one walking past in a blur, under red neon and a ceiling hung with roses."
  join: "A Seven Hills night: the screen above the red-lit room reads “the inner circle”, guests in silhouette below."
  partners: "A runway show in a glass-walled warehouse, guests watching a model walk past."
  lisboa: "A rooftop terrace in Lisboa at sunset: tables set under a white roof, the city's rooftops below."

# Which part of a photo stays in view when its place crops it: top, bottom,
# left or right, or two numbers (from the left, from the top): "35% 50%".
# A photo that isn't listed here is cropped around its middle.
photo_focus:
  hero: "35% 50%"
  partners: "88% 100%"


# ═════════════════════════════════════════════════════════════════════════════
#  6. TEXT (English)
#  accent: the one line of each part that is set in italics (Instrument Serif).
#  A Portuguese version can be added later as a copy of this block called "pt:".
# ═════════════════════════════════════════════════════════════════════════════
en:
  meta:
    title: "Seven Hills · Members Club"
    description: "A private circle for founders, athletes and creatives, born in Lisboa. Dinners, sport, travel and culture, with people chosen for character."

  nav:
    # The header links, in this order. Agenda only shows while there are dates.
