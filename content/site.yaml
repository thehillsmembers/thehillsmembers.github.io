      - label: Experiences
        href: "/#experiences"
      - label: Agenda
        href: "/#agenda"
      - label: The Circle
        href: "/#circle"
      - label: How to join
        href: "/#join"
      - label: Partners
        href: "/#partners"
      - label: Cities
        href: "/#cities"
    apply: Apply
    menu: Menu
    home: Seven Hills, home

  hero:
