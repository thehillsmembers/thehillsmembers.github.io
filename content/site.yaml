      - Athletes.
      - Creatives.
    accent: "A private circle, born in Lisboa. Dinners, sport, travel and culture."
    cta: Apply

  experiences:
    title: Five experiences
    accent: "Every gathering exists first for the people who are there."
    previous: Previous
    next: Next
    # label: the small line in Ouro above each name
    # dots: true adds the row of seven dots, one for each hill
    items:
      - name: Table of Seven
        label: "Monthly · Members"
        line: "A long dinner, a host, one question for the night."
      - name: Seven Hills Run
        label: "Monthly · Open to the network"
        line: "Seven hills of Lisboa, early morning."
