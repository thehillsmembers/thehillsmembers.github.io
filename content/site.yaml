  apply:
    meta_title: "Apply · Seven Hills"
    meta_description: "Apply to join Seven Hills, a private circle for founders, athletes and creatives, born in Lisboa."
    label: Apply
    # on the home page
    home_title: "Write as you would at the table."
    home_accent: "We read every application ourselves."
    # on its own page (/apply/)
    title: Tell us who you are
    intro: "We don't look for CVs. Write as you would at the table."
    required_note: "Fields marked * are required."
    fields:
      name: Full name
      email: Email
      city: City
      social: Instagram or LinkedIn
      social_hint: "A handle or a link."
      what: What do you do
      what_hint: "One line."
      who: Tell us who you are
      bring: What would you bring to the table?
      referred: Referred by a member?
      referred_hint: "Optional. Their name."
      experiences: Experiences you're drawn to
      consent_before: "I agree that Seven Hills keeps the details above to review my application, as described in the"
      consent_link: privacy notice
    submit: Send application
    thanks_title: Thank you
    thanks: "Thank you. We read every application ourselves and will be in touch."
    back: Back to Seven Hills

  partner_form:
    meta_title: "Partner with us · Seven Hills"
    meta_description: "Co-host an experience with Seven Hills. Hosts, experiences and limited product collaborations."
    label: Partners
    title: Partner with us
    intro: "Co-hosted, not sponsored. Tell us what you would like to build together."
