  privacy:
    meta_title: "Privacy · Seven Hills"
    meta_description: "How Seven Hills handles the details you send through the application and partner forms."
    label: Privacy
    title: Privacy notice
    updated: "Last updated: 23.11.2026"
    sections:
      - heading: Who we are
        body:
          - "The controller of your data is André Carvalho, Lisbon, Portugal."
          - "Contact for anything about your data: thehillsmembers@gmail.com."
      - heading: What we collect
        body:
          - "Application form: full name, email, city, Instagram or LinkedIn, what you do, your answers about who you are and what you would bring, the name of a referring member if you give one, and the experiences you are drawn to."
          - "Partner form: name, brand or company, email, partnership type and your proposal."
          - "We collect nothing else. This site uses no cookies, no analytics and no tracking. Fonts are served from this site, not from third parties."
      - heading: Why we use it
        body:
          - "To read your application or proposal, to contact you about it and, if it goes ahead, to welcome you as a member or partner."
          - "The legal basis is your consent, given with the checkbox on each form, and the steps you ask us to take before any agreement."
          - "We never sell your data and never share it with partners or other members."
      - heading: Who processes it
        body:
          - "This site is hosted on GitHub Pages by GitHub, Inc., which keeps logs of visitors' IP addresses to keep its service secure."
          - "What you send through the forms is received and stored by Formspree, Inc., which forwards it to our email inbox, run by Google (Gmail)."
          - "These companies are based in the United States, so your data may be processed outside the EU, under each provider's own data protection terms."
      - heading: How long we keep it
        body:
          - "Applications and proposals that do not go ahead are deleted within 12 months of our reply."
          - "If you become a member or partner, we keep your details for as long as that relationship lasts, and delete them within 12 months after it ends."
      - heading: Your rights
        body:
          - "You can ask to see, correct or delete your data, to limit or object to how we use it, or to receive a copy. You can withdraw consent at any time; this does not affect what was done before."
          - "To ask for any of this, including deletion, write to thehillsmembers@gmail.com. We reply within 30 days."
          - "You can also complain to the Portuguese data protection authority, CNPD (cnpd.pt)."
